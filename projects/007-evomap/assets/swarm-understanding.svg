<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2220" viewBox="0 0 1800 2220" role="img" aria-labelledby="title desc">
<title id="title">蜂群：按需组织 Agent，让经验跨任务复用</title>
<desc id="desc">蜂群属于多 Agent 协作。按能力组队，提供技能经验，执行后审查、返工或汇总交付，并记录结果。角色、能力、经验分别表示负责什么、能做什么、如何做得更好。本图为概念归纳，未验证 EvoMap 云端蜂群效果。</desc>
<rect width="1800" height="2220" fill="#f4f7fc"/>
<text x="64" y="63.120000000000005" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#2855db">EVOMAP · SWARM    /    蜂群理解图</text>
<text x="64" y="143.76" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="52" font-weight="700" fill="#172840">按需组织 Agent，让经验跨任务复用</text>
<text x="64" y="205.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="400" fill="#52647d">蜂群属于多 Agent 协作，强调围绕目标组队、协调、审查与迭代。</text>
<rect x="64" y="257" width="536" height="170" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="88" y="307.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#2855db">能力：能做什么</text>
<text x="88" y="359.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">模型、工具、运行环境与权限</text>
<text x="88" y="399.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">会读部署说明，不等于能访问服务器</text>
<rect x="632" y="257" width="536" height="170" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="656" y="307.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#2855db">角色：这次负责什么</text>
<text x="656" y="359.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">协调、执行、审查、汇总</text>
<text x="656" y="399.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">岗位随任务变化，不必永久固定</text>
<rect x="1200" y="257" width="536" height="170" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="1224" y="307.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#2855db">经验：如何做得更好</text>
<text x="1224" y="359.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">技能方法、适用条件与历史案例</text>
<text x="1224" y="399.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">按需检索，并在当前环境重新验证</text>
<text x="64" y="499.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">01   “按需赋能”要拆成两个动作</text>
<rect x="64" y="529" width="810" height="170" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="90" y="579.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#2855db">按能力选 Agent</text>
<text x="90" y="631.76" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="400" fill="#52647d">从可用参与者中找适合当前任务的执行者。</text>
<text x="90" y="675.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">可以由平台派单，也可以由 Agent 认领。</text>
<rect x="904" y="529" width="832" height="170" rx="18" fill="#eaf5f1" stroke="#c7dfd5" stroke-width="2"/>
<text x="930" y="579.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#176b5a">按需提供技能与经验</text>
<text x="930" y="631.76" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="400" fill="#52647d">补充方法、案例、约束和任务上下文。</text>
<text x="930" y="675.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">仍需具备执行工具与权限，并验证是否适用。</text>
<text x="64" y="770.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">02   一次任务：组队 → 执行 → 审查 → 交付</text>
<rect x="64" y="811" width="280" height="165" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="84" y="859.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#2855db">提出目标</text>
<text x="84" y="908.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">明确要交付什么</text>
<text x="84" y="951.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">定义验收标准</text>
<polyline points="353,891 398,891" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="398,891 383,882 383,900" fill="#2855db"/>
<rect x="410" y="811" width="280" height="165" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="430" y="859.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#2855db">规划与组队</text>
<text x="430" y="908.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">拆分任务、匹配能力</text>
<text x="430" y="951.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">分配这次的角色</text>
<polyline points="699,891 744,891" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="744,891 729,882 729,900" fill="#2855db"/>
<rect x="756" y="811" width="280" height="165" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="776" y="859.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#2855db">Agent 执行</text>
<text x="776" y="908.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">分工、探索或接力</text>
<text x="776" y="951.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">用工具完成工作</text>
<polyline points="1045,891 1090,891" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="1090,891 1075,882 1075,900" fill="#2855db"/>
<rect x="1102" y="811" width="280" height="165" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="1122" y="859.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#2855db">检查与审查</text>
<text x="1122" y="908.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">核对证据与结果</text>
<text x="1122" y="951.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">判断是否要返工</text>
<polyline points="1391,891 1436,891" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="1436,891 1421,882 1421,900" fill="#2855db"/>
<rect x="1448" y="811" width="280" height="165" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="1468" y="859.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#2855db">汇总与交付</text>
<text x="1468" y="908.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">整合通过的结果</text>
<text x="1468" y="951.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">接受最终验收</text>
<polyline points="1242,986 1242,1030 896,1030 896,986" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="896,986 887,1001 905,1001" fill="#2855db"/>
<text x="965" y="1069.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#2855db">未通过：修改后重验</text>
<polyline points="550,1158 550,991" fill="none" stroke="#176b5a" stroke-width="4" stroke-linejoin="round"/><polygon points="550,991 541,1006 559,1006" fill="#176b5a"/>
<text x="235" y="1091.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#176b5a">检索适用的方法与案例</text>
<polyline points="1588,987 1588,1158" fill="none" stroke="#176b5a" stroke-width="4" stroke-linejoin="round"/><polygon points="1588,1158 1579,1143 1597,1143" fill="#176b5a"/>
<text x="1285" y="1121.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#176b5a">记录成败与适用条件</text>
<rect x="64" y="1170" width="1672" height="210" rx="18" fill="#eaf5f1" stroke="#a8cfbe" stroke-width="2"/>
<text x="92" y="1224.04" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="33" font-weight="700" fill="#176b5a">共享技能与经验库</text>
<text x="92" y="1279.64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#52647d">留下方法、使用条件、执行案例、失败原因与验证记录。</text>
<text x="92" y="1335.64" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="28" font-weight="400" fill="#52647d">本次团队可以借鉴过去；本次结果也可以供下次任务、其他 Agent 复用。</text>
<text x="64" y="1455.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">03   “蜂后 / 工蜂”是岗位比喻，不是固定身份</text>
<rect x="64" y="1487" width="382" height="132" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="86" y="1535.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#172840">协调者</text>
<text x="86" y="1587.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">拆任务、组织参与者</text>
<rect x="494" y="1487" width="382" height="132" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="516" y="1535.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#172840">执行者</text>
<text x="516" y="1587.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">研究、编程、测试</text>
<rect x="924" y="1487" width="382" height="132" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="946" y="1535.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#172840">审查者</text>
<text x="946" y="1587.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">核对结果、要求返工</text>
<rect x="1354" y="1487" width="382" height="132" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="1376" y="1535.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#172840">汇总者</text>
<text x="1376" y="1587.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">整合产物、形成交付</text>
<text x="64" y="1690.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">04   不只沉淀工种技能，也积累流程与组织反馈</text>
<rect x="64" y="1720" width="536" height="170" rx="18" fill="#eaf5f1" stroke="#c7dfd5" stroke-width="2"/>
<text x="88" y="1771.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#176b5a">方法沉淀</text>
<text x="88" y="1822.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">怎样做事：策略与执行案例</text>
<text x="88" y="1867.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">跨角色复用，仍需验证适用性</text>
<rect x="632" y="1720" width="536" height="170" rx="18" fill="#eaf5f1" stroke="#c7dfd5" stroke-width="2"/>
<text x="656" y="1771.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#176b5a">流程沉淀</text>
<text x="656" y="1822.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">怎样接力：可复用流程模板</text>
<text x="656" y="1867.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">留下步骤、角色和交接约定</text>
<rect x="1200" y="1720" width="536" height="170" rx="18" fill="#eaf5f1" stroke="#c7dfd5" stroke-width="2"/>
<text x="1224" y="1771.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#176b5a">组织反馈</text>
<text x="1224" y="1822.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">怎样组队：协同与编排记录</text>
<text x="1224" y="1867.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">为后续选人和选流程提供依据</text>
<rect x="64" y="1945" width="1672" height="172" rx="18" fill="#142852" stroke="#142852" stroke-width="2"/>
<text x="92" y="1999.04" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="33" font-weight="700" fill="#ffffff">协作组织当下的工作；经验沉淀连接前后多次任务。</text>
<text x="92" y="2050.88" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#d0ddf5">平台还描述：任务通信、超时候补、预算并发控制，以及贡献结算。</text>
<text x="92" y="2094.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#d0ddf5">上述为平台文档与概念归纳；不等于本地库独立具备全部能力，云端收益尚未实测。</text>
<text x="64" y="2180.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">独立研究概念图 · 依据官方 Swarm 文档与我们的理解归纳，并非官方部署架构。</text>
</svg>
