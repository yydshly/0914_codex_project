<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1760" viewBox="0 0 1800 1760" role="img" aria-labelledby="title desc">
<title id="title">AI 技能与经验沉淀：值得参考的产品方向</title>
<desc id="desc">任务触发检索，AI 使用技能执行，验证结果后把经验回写本地经验库。由个人复用扩展到团队共享，再探索群体智能；收益仍需要对照验证。</desc>
<rect width="1800" height="1760" fill="#f4f7fc"/>
<text x="64" y="66.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#2855db">EVOMAP / EVOLVER    ·    我们的理解</text>
<text x="64" y="144.88" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="51" font-weight="700" fill="#172840">让 AI 的做事经验，成为可复用的能力资产</text>
<text x="64" y="204.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="400" fill="#52647d">群体智能愿景：探索类似 RAG 的经验检索与沉淀，让多个 Agent 复用。</text>
<rect x="64" y="250" width="1672" height="82" rx="12" fill="#e7eefc" stroke="#e7eefc" stroke-width="2"/>
<text x="91" y="300.28" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="31" font-weight="700" fill="#2855db">有参考价值：可以先从“技能 + 本地经验库”做起，再验证是否值得扩展。</text>
<rect x="64" y="370" width="810" height="150" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="90" y="421.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#172840">多 Agent：组织这一次的能力协作</text>
<text x="90" y="471.76" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="400" fill="#52647d">谁分析、谁执行、谁审查，怎样合并结果。</text>
<rect x="904" y="370" width="832" height="150" rx="18" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="930" y="421.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#2855db">经验沉淀：让下一次有方法可借鉴</text>
<text x="930" y="471.76" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="400" fill="#52647d">留下做法、条件、成败与验证依据。</text>
<text x="64" y="588.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">01   一次任务怎样变成可复用经验</text>
<rect x="64" y="619" width="280" height="158" rx="14" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="84" y="667.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#172840">提出任务</text>
<text x="84" y="715.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">需求、错误、环境</text>
<text x="84" y="753.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">明确这次要做什么</text>
<polyline points="350,698 398,698" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="398,698 383,689 383,707" fill="#2855db"/>
<rect x="410" y="619" width="280" height="158" rx="14" fill="#ffffff" stroke="#2855db" stroke-width="2"/>
<text x="430" y="667.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#2855db">检索与匹配</text>
<text x="430" y="715.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">找技能和相关案例</text>
<text x="430" y="753.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">判断适用条件</text>
<polyline points="696,698 744,698" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="744,698 729,689 729,707" fill="#2855db"/>
<rect x="756" y="619" width="280" height="158" rx="14" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="776" y="667.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#172840">AI + 工具执行</text>
<text x="776" y="715.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">读取方法、调用工具</text>
<text x="776" y="753.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">在当前项目中做事</text>
<polyline points="1042,698 1090,698" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="1090,698 1075,689 1075,707" fill="#2855db"/>
<rect x="1102" y="619" width="280" height="158" rx="14" fill="#ffffff" stroke="#d5dfed" stroke-width="2"/>
<text x="1122" y="667.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#172840">验证结果</text>
<text x="1122" y="715.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">检查是否满足要求</text>
<text x="1122" y="753.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">用实际结果判断</text>
<polyline points="1388,698 1436,698" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="1436,698 1421,689 1421,707" fill="#2855db"/>
<rect x="1448" y="619" width="280" height="158" rx="14" fill="#ffffff" stroke="#2855db" stroke-width="2"/>
<text x="1468" y="667.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#2855db">沉淀反馈</text>
<text x="1468" y="715.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">记录成功与失败</text>
<text x="1468" y="753.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">更新经验和版本</text>
<polyline points="550,865 550,792" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="550,792 541,807 559,807" fill="#2855db"/>
<text x="580" y="826.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#2855db">读取可用经验</text>
<polyline points="1588,788 1588,854" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="1588,854 1579,839 1597,839" fill="#2855db"/>
<text x="1250" y="826.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#2855db">回写结果与适用边界</text>
<rect x="64" y="870" width="1672" height="280" rx="18" fill="#ffffff" stroke="#2855db" stroke-width="2"/>
<text x="92" y="922.16" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="32" font-weight="700" fill="#2855db">本地技能与经验库</text>
<text x="454" y="922.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">文件、JSON / JSONL 或数据库都可以；数据库主要负责保存和查找。</text>
<text x="92" y="992.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">技能与方法</text>
<text x="92" y="1044.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">操作说明、脚本、工具入口</text>
<text x="92" y="1091.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">Gene：可复用的策略</text>
<text x="650" y="992.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">使用条件与版本</text>
<text x="650" y="1044.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">什么时候适用、依赖什么环境</text>
<text x="650" y="1091.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">让检索结果更容易判断</text>
<text x="1200" y="992.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">案例、成败与验证</text>
<text x="1200" y="1044.0" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="25" font-weight="400" fill="#52647d">执行结果、失败原因、验收记录</text>
<text x="1200" y="1091.12" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#52647d">Capsule 与事件：案例和过程</text>
<text x="64" y="1228.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">02   从一个可落地的产品起点，逐步扩展</text>
<rect x="64" y="1257" width="512" height="142" rx="14" fill="#edf2fc" stroke="#edf2fc" stroke-width="2"/>
<text x="86" y="1305.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#2855db">A</text>
<text x="134" y="1304.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">个人技能经验库</text>
<text x="86" y="1361.88" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#52647d">让自己的 AI 少重复摸索</text>
<rect x="644" y="1257" width="512" height="142" rx="14" fill="#edf2fc" stroke="#edf2fc" stroke-width="2"/>
<text x="666" y="1305.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#2855db">B</text>
<text x="714" y="1304.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">团队与跨 Agent 共享</text>
<text x="666" y="1361.88" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#52647d">让不同执行者复用经验</text>
<rect x="1224" y="1257" width="512" height="142" rx="14" fill="#edf2fc" stroke="#edf2fc" stroke-width="2"/>
<text x="1246" y="1305.4" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#2855db">C</text>
<text x="1294" y="1304.52" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#172840">探索群体智能</text>
<text x="1246" y="1361.88" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="400" fill="#52647d">验证协作能否提高整体能力</text>
<polyline points="588,1328 631,1328" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="631,1328 616,1319 616,1337" fill="#2855db"/>
<polyline points="1168,1328 1211,1328" fill="none" stroke="#2855db" stroke-width="4" stroke-linejoin="round"/><polygon points="1211,1328 1196,1319 1196,1337" fill="#2855db"/>
<rect x="64" y="1451" width="1672" height="218" rx="18" fill="#142852" stroke="#142852" stroke-width="2"/>
<text x="92" y="1507.92" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="34" font-weight="700" fill="#ffffff">参考的是这套产品思路；实际收益还要用任务证明。</text>
<text x="92" y="1564.76" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="400" fill="#d0ddf5">值得借鉴：可检索的方法、适用条件、执行记录，以及持续更新的反馈。</text>
<text x="92" y="1615.76" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="27" font-weight="400" fill="#d0ddf5">验证价值：相同模型与任务下，成功率是否提高，总成本与人工干预是否减少？</text>
<text x="64" y="1720.24" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" font-weight="400" fill="#52647d">研究归纳 · 本地落地路线为我们的产品化建议，非官方部署架构；群体超级智能仍是愿景。</text>
</svg>