<text x="463" y="294.2" font-size="28" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#267b69">物品 / 演员</text>
<text x="463" y="331.6" font-size="24" font-weight="400" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#5b7067">可独立控制的图层</text>
<rect x="812" y="253" width="344" height="98" rx="14" fill="#e5ecdf" stroke="#cfd8ca" stroke-width="2"/>
<text x="833" y="294.2" font-size="28" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#267b69">代码 / 动作脚本</text>
<text x="833" y="331.6" font-size="24" font-weight="400" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#5b7067">路径、状态与遮挡</text>
<rect x="1182" y="253" width="344" height="98" rx="14" fill="#e5ecdf" stroke="#cfd8ca" stroke-width="2"/>
<text x="1203" y="294.2" font-size="28" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#267b69">时间轴 / 演出节拍</text>
<text x="1203" y="331.6" font-size="24" font-weight="400" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#5b7067">统一的时间参数 t</text>
<text x="72" y="408.0" font-size="30" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#213f39">制作准备：把“演什么”和“何时演”对应起来</text>
