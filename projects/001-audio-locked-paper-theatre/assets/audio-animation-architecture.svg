<text x="96" y="541.3" font-size="27" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#213f39">确定讲解内容和画面含义</text>
<text x="96" y="582.5" font-size="25" font-weight="400" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#5b7067">例：小球进入盒子，表现 in</text>
<rect x="577" y="441" width="430" height="180" rx="14" fill="#fffdf7" stroke="#cfd8ca" stroke-width="2"/>
<text x="601" y="493.6" font-size="34" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#267b69">语音合成</text>
<text x="601" y="541.3" font-size="27" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#213f39">本地使用 MiniMax</text>
<text x="601" y="582.5" font-size="25" font-weight="400" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#5b7067">生成真实配音与句级时间戳</text>
