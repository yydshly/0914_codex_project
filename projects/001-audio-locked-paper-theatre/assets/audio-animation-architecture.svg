<text x="72" y="1684.5" font-size="25" font-weight="400" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#5b7067">上游 Skill 提供制作规范、模板和验证工具；本图以本地复现说明各工具如何配合。</text>
<text x="72" y="1728.5" font-size="25" font-weight="400" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#5b7067">音频提供时间依据，分镜与代码负责语义表达。观众答题、拖拽等交互需另加逻辑。</text>
