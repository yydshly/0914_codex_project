<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760" role="img" aria-labelledby="title desc"><title id="title">音频时间轴怎样驱动画板对象</title><desc id="desc">讲稿和分镜分别驱动语音合成、对象准备与动作编排。真实时间戳提供时间依据。渲染器读取时间、动作规则和独立图层，逐帧绘制画面，再与原始音轨合成视频。</desc><rect width="1600" height="1760" fill="#f5f1e6"/>
<text x="72" y="69.5" font-size="25" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#267b69">PAPER THEATRE / 音频驱动动画架构</text>
<text x="72" y="154.4" font-size="56" font-weight="700" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#213f39">声音给时间，代码让物品演出</text>
<text x="72" y="214.1" font-size="29" font-weight="400" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#5b7067">画板是舞台，物品是演员，代码是动作脚本，音频时间轴是演出节拍。</text>
<rect x="72" y="253" width="344" height="98" rx="14" fill="#e5ecdf" stroke="#cfd8ca" stroke-width="2"/>
