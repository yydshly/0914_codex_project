<style>
.practice{margin-top:36px;padding:28px;background:#fffdf5;border:1px solid #d6d9ca;border-radius:14px}.practice h2{font-size:24px}.quiz-layout{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:32px;margin-top:18px}.quiz-scene{width:100%;max-height:270px;background:#f0eddf;border-radius:12px}.quiz-options{display:flex;gap:12px;margin:18px 0}.quiz-options button{min-width:86px;text-align:center;font-size:22px}.quiz-options button:disabled{cursor:default;opacity:.65}.quiz-options button[data-correct=true]{background:#dfecdc;border-color:#287d70;opacity:1}.quiz-options button[data-wrong=true]{background:#fae3d8;border-color:#b86145;opacity:1}.quiz-feedback{min-height:62px;color:#223d37}.quiz-next{background:#287d70;color:white;margin-top:10px}.quiz-next:hover{background:#216859}.quiz-meta{font-size:13px;letter-spacing:1px;color:#287d70}#quiz-sentence{font-size:24px;color:#223d37;margin:10px 0}.practice [hidden]{display:none!important}@media(max-width:680px){.practice{padding:20px}.quiz-layout{grid-template-columns:1fr;gap:20px}.quiz-options{flex-wrap:wrap}}
</style>
<section class="practice" aria-labelledby="practice-title"><div class="quiz-meta">YOUR TURN / 看图练习</div><h2 id="practice-title">把看到的位置，说成一句英语。</h2><p>先大声说出句子，再选一个词检查答案。共 3 题，答完可重新练习。</p><div class="quiz-layout"><svg id="quiz-scene" class="quiz-scene" viewBox="0 0 480 300" role="img" aria-label="小球与物体的位置示意"></svg><div><span id="quiz-progress" class="quiz-meta"></span><p id="quiz-sentence"></p><div class="quiz-options" role="group" aria-label="选择位置词"><button type="button" data-answer="in">in</button><button type="button" data-answer="on">on</button><button type="button" data-answer="under">under</button></div><p id="quiz-feedback" class="quiz-feedback" role="status" aria-live="polite">Where is the ball?</p><button type="button" id="quiz-next" class="quiz-next" hidden>下一题 →</button></div></div><p class="note" style="margin-top:20px">课堂用法：播放示范 → 暂停让学生跟读 → 看图口头回答 → 用身边的物品换词造句。这里检查词语选择，口语表现由老师或学习者另行判断。</p></section>
<script>
(()=>{const qs=[{answer:'on',object:'table',reason:'小球接触桌子的表面，用 on。'},{answer:'in',object:'box',reason:'小球在盒子内部，用 in。'},{answer:'under',object:'table',reason:'小球在桌子下方，用 under。'}];let current=0,score=0,answered=false;const scene=document.getElementById('quiz-scene'),progress=document.getElementById('quiz-progress'),sentence=document.getElementById('quiz-sentence'),feedback=document.getElementById('quiz-feedback'),next=document.getElementById('quiz-next'),options=[...document.querySelectorAll('[data-answer]')];
function draw(){const q=qs[current];let shape='<path d="M55 255 H425" stroke="#c5c6b5" stroke-width="3"/>';if(q.object==='table'){shape+='<rect x="130" y="140" width="220" height="20" rx="3" fill="#bd9559"/><rect x="147" y="160" width="16" height="95" fill="#a77d44"/><rect x="317" y="160" width="16" height="95" fill="#a77d44"/><circle cx="240" cy="'+(q.answer==='on'?114:229)+'" r="26" fill="#d97851"/>';}else{shape+='<path d="M135 170 L175 143 H345 L320 178 Z" fill="#c0deeb" stroke="#86b6d0" stroke-width="2"/><path d="M135 170 H320 V255 H135 Z" fill="#99cce3"/><circle cx="235" cy="176" r="29" fill="#d97851"/><path d="M135 192 H320 V255 H135 Z" fill="#83bbd6"/><path d="M320 192 L345 161 V232 L320 255 Z" fill="#609cbd"/>';}scene.innerHTML=shape;scene.setAttribute('aria-label',q.answer==='on'?'小球贴着桌面的上侧':q.answer==='in'?'小球的一部分被盒子前壁遮挡，处于内部':'小球处于桌面下方，两条桌腿之间');}
function show(){answered=false;draw();progress.textContent=`第 ${current+1} / 3 题`;sentence.textContent=`The ball is ___ the ${qs[current].object}.`;feedback.textContent='Where is the ball?';next.hidden=true;for(const b of options){b.disabled=false;delete b.dataset.correct;delete b.dataset.wrong;}}
for(const b of options)b.addEventListener('click',()=>{if(answered)return;answered=true;const q=qs[current],right=b.dataset.answer===q.answer;if(right)score++;for(const x of options){x.disabled=true;if(x.dataset.answer===q.answer)x.dataset.correct='true';}if(!right)b.dataset.wrong='true';sentence.textContent=`The ball is ${q.answer} the ${q.object}.`;feedback.textContent=(right?'答对了！':'再看一下位置。')+' '+q.reason+(current===2?` 本轮答对 ${score} / 3 题。`:'');next.textContent=current===2?'重新练习 ↻':'下一题 →';next.hidden=false;});next.addEventListener('click',()=>{if(current===2){current=0;score=0;}else current++;show();});show();})();
</script>
