<text x="101" y="360" font-size="27" font-weight="700" fill="#ffffff">01</text>
<text x="162" y="360" font-size="37" font-weight="700" fill="#102d42">先分清三个维度，它们可以组合</text>
<text x="162" y="402" font-size="25" font-weight="400" fill="#587080">“创建新图、添加动画、导入重绘”是使用路径；图型、表现方式和输入来源分别回答不同问题。</text>
