<text x="90" y="165" font-size="64" font-weight="700" fill="#ffffff">从内容与关系，到可编辑的图</text>
<text x="92" y="223" font-size="33" font-weight="400" fill="#d5e5ec">AI 理解与编写  ×  设计规范与模板  ×  浏览器渲染</text>
