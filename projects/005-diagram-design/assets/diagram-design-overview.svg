<rect x="90" y="2313" width="52" height="48" rx="10" fill="#087e8b" stroke="none"/>
<text x="101" y="2348" font-size="27" font-weight="700" fill="#ffffff">04</text>
<text x="162" y="2348" font-size="37" font-weight="700" fill="#102d42">怎么画：先明确内容，再选择表达</text>
<text x="162" y="2390" font-size="25" font-weight="400" fill="#587080">将这套 Skill 用在支持的 AI 工作环境中，提供真实内容与约束；按以下步骤逐轮生成、核对和修改。</text>
<rect x="90" y="2421" width="586" height="100" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="109" y="2459" font-size="28" font-weight="700" fill="#087e8b">1  提供事实</text>
<text x="109" y="2497" font-size="23" font-weight="400" fill="#183b50">列出节点、关系、数据、单位和来源。</text>
<rect x="707" y="2421" width="586" height="100" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="726" y="2459" font-size="28" font-weight="700" fill="#087e8b">2  明确受众</text>
<text x="726" y="2497" font-size="23" font-weight="400" fill="#183b50">说明谁来看、看完要理解什么。</text>
<rect x="1324" y="2421" width="586" height="100" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="1343" y="2459" font-size="28" font-weight="700" fill="#087e8b">3  选择图型</text>
<text x="1343" y="2497" font-size="23" font-weight="400" fill="#183b50">结构用架构，步骤用流程，趋势用折线。</text>
<rect x="90" y="2536" width="586" height="100" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="109" y="2574" font-size="28" font-weight="700" fill="#087e8b">4  设置输出</text>
<text x="109" y="2612" font-size="23" font-weight="400" fill="#183b50">确定格式、尺寸、细节量、受众与配色。</text>
<rect x="707" y="2536" width="586" height="100" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="726" y="2574" font-size="28" font-weight="700" fill="#087e8b">5  生成并核对</text>
<text x="726" y="2612" font-size="23" font-weight="400" fill="#183b50">检查事实、比例、连线、遮挡与可读性。</text>
<rect x="1324" y="2536" width="586" height="100" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="1343" y="2574" font-size="28" font-weight="700" fill="#087e8b">6  修改与交付</text>
<text x="1343" y="2612" font-size="23" font-weight="400" fill="#183b50">保留可编辑源文件，导出所需格式。</text>
<rect x="90" y="2671" width="1820" height="143" rx="14" fill="#102d42" stroke="none"/>
<text x="117" y="2713" font-size="24" font-weight="700" fill="#8cddd5">可以这样提需求</text>
<text x="117" y="2758" font-size="28" font-weight="400" fill="#ffffff">“将这些系统关系画成中文架构图，面向非技术同事，16:9、蓝色；保留核心关系，</text>
<text x="117" y="2799" font-size="26" font-weight="400" fill="#ffffff">说明合并项，输出 HTML、SVG 和 PNG。”</text>
<rect x="90" y="2840" width="52" height="48" rx="10" fill="#087e8b" stroke="none"/>
<text x="101" y="2875" font-size="27" font-weight="700" fill="#ffffff">05</text>
<text x="162" y="2875" font-size="37" font-weight="700" fill="#102d42">交付、用途与扩展方向</text>
<text x="162" y="2917" font-size="25" font-weight="400" fill="#587080">对我们最直接的价值：把研究资料、旧图和讨论结果，整理成统一、清晰、可复用的视觉说明。</text>
<rect x="90" y="2948" width="586" height="191" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="113" y="2992" font-size="29" font-weight="700" fill="#183b50">输出什么</text>
<text x="113" y="3038" font-size="23" font-weight="400" fill="#587080">HTML：浏览器展示，可承载交互 / 动画</text>
<text x="113" y="3074" font-size="23" font-weight="400" fill="#587080">SVG：可编辑矢量图，放大清晰</text>
<text x="113" y="3110" font-size="23" font-weight="400" fill="#587080">PNG：像素图片，适合文档与分享</text>
<rect x="707" y="2948" width="586" height="191" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="730" y="2992" font-size="29" font-weight="700" fill="#183b50">适合用在哪里</text>
<text x="730" y="3038" font-size="23" font-weight="400" fill="#587080">研究笔记与技术方案配图</text>
<text x="730" y="3074" font-size="23" font-weight="400" fill="#587080">流程交接、教学说明、管理汇报</text>
<text x="730" y="3110" font-size="23" font-weight="400" fill="#587080">旧图整理、品牌统一、演示材料</text>
<rect x="1324" y="2948" width="586" height="191" rx="12" fill="#ffffff" stroke="#d9e3e8"/>
<text x="1347" y="2992" font-size="29" font-weight="700" fill="#183b50">可以怎样扩展〔建议〕</text>
<text x="1347" y="3038" font-size="23" font-weight="400" fill="#587080">接入真实数据与代码关系提取</text>
<text x="1347" y="3074" font-size="23" font-weight="400" fill="#587080">加入团队图型、品牌与中文模板</text>
<text x="1347" y="3110" font-size="23" font-weight="400" fill="#587080">批量生成、事实校验、版本对比</text>
<text x="94" y="3190" font-size="24" font-weight="400" fill="#587080">边界：检查通过不等于事实正确；旧图重绘不保证原布局；PNG 是静态的，SVG / PNG 单图导出不含页面外围摘要。</text>
<text x="94" y="3232" font-size="24" font-weight="400" fill="#587080">当前展厅展示预先保存的示例，切换分类与版本不会实时调用 AI；图型库也不等同于通用自动布局引擎。</text>
<path d="M90 3262 L1910 3262" fill="none" stroke="#cedbe3" stroke-width="2"/>
<text x="92" y="3303" font-size="23" font-weight="400" fill="#587080">来源：cathrynlavery/diagram-design · v2.6.23 · ce9344c52cb9  |  本地研究整理 · 2026-09-16</text>
<text x="92" y="3337" font-size="22" font-weight="600" fill="#087e8b">阅读路径：分清维度 → 理解原理 → 选择图型 → 提供内容与约束 → 核对 → 交付</text>
</g></svg>