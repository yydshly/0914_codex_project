<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="research-dark-title research-dark-desc"><title id="research-dark-title">GitHub 项目研究流程</title><desc id="research-dark-desc">资料经提取、核实、整理图规格、绘图与检查导出，形成研究配图；这是建议流程，不代表实际自动化系统。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bac7dc"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#8daaff"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#172032"/><text x="64" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="18" fill="#bac7dc" text-anchor="start" font-weight="400">研究流程 / 中文重绘实验</text><text x="64" y="104" font-family="Georgia,'Noto Serif SC',SimSun,serif" font-size="36" fill="#eef3ff" text-anchor="start" font-weight="400">GitHub 项目研究流程</text><path d="M 352 238 L 496 238" fill="none" stroke="#bac7dc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 784 238 L 928 238" fill="none" stroke="#bac7dc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1072 296 L 1072 436" fill="none" stroke="#bac7dc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 928 494 L 784 494" fill="none" stroke="#bac7dc" stroke-width="2" marker-end="url(#arrow)"/><path d="M 496 494 L 352 494" fill="none" stroke="#bac7dc" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="180" width="288" height="116" rx="6" fill="#1f2b42" stroke="#64748d" stroke-width="1"/><text x="84" y="209" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#bac7dc" text-anchor="start" font-weight="400">01</text><text x="84" y="245" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="26" fill="#e