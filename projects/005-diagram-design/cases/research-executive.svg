<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="research-executive-title research-executive-desc"><title id="research-executive-title">从理解资料，到制作交付</title><desc id="research-executive-desc">资料经提取、核实、整理图规格、绘图与检查导出，形成研究配图；这是建议流程，不代表实际自动化系统。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#506078"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#335deb"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs><rect width="1280" height="720" fill="#f5f6f8"/><text x="64" y="52" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="18" fill="#506078" text-anchor="start" font-weight="400">研究流程 / 中文重绘实验</text><text x="64" y="104" font-family="Georgia,'Noto Serif SC',SimSun,serif" font-size="36" fill="#16253d" text-anchor="start" font-weight="400">从理解资料，到制作交付</text><path d="M 352 324 L 496 324" fill="none" stroke="#506078" stroke-width="2" marker-end="url(#arrow)"/><path d="M 784 324 L 928 324" fill="none" stroke="#506078" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="248" width="288" height="152" rx="6" fill="#ffffff" stroke="#bdc9d9" stroke-width="1"/><text x="84" y="277" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#506078" text-anchor="start" font-weight="400">01</text><text x="84" y="313" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="26" fill="#16253d" text-anchor="start" font-weight="600">理解资料</text><text x="84" y="343" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" fill="#506078" text-anchor="start" font-weight="400">原始资料 · 提取关系</text><rect x="496" y="248" width="288" height="152" rx="6" fill="#e9eeff" stroke="#335deb" stroke-width="2"/><text x="516" y="277" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#506078" text-anchor="start" font-weight="400">02</text><text x="516" y="313" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="26" fill="#16253d" text-anchor="start" font-weight="600">确认表达</text><text x="516" y="343" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" fill="#506078" text-anchor="start" font-weight="400">核实事实 · 整理图规格</text><rect x="928" y="248" width="288" height="152" rx="6" fill="#ffffff" stroke="#bdc9d9" stroke-width="1"/><text x="948" y="277" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#506078" text-anchor="start" font-weight="400">03</text><text x="948" y="313" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="26" fill="#16253d" text-anchor="start" font-weight="600">制作交付</text><text x="948" y="343" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="20" fill="#506078" text-anchor="start" font-weight="400">生成图形 · 检查与导出</text><path d="M64 604 H1216" stroke="#bdc9d9" stroke-width="1"/><text x="64" y="644" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="22" fill="#16253d" text-anchor="start" font-weight="400">关系由人与 AI 确认；图形负责清晰表达。</text><text x="64" y="680" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="18" fill="#506078" text-anchor="start" font-weight="400">本研究的建议流程 · 实线表示先后关系 · 焦点表示需要核实的阶段</text></svg>