<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>示例服务控制面板</title>
<style>body{margin:0;background:#111a2a;color:#edf5ff;font:16px/1.8 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:620px;margin:auto;padding:40px 28px}small{color:#93adca}h1{font-size:28px}#state{font-size:23px;font-weight:700;padding:24px;background:#1d2b40;border-radius:12px;margin:20px 0}button{background:#7ae3cc;color:#101a26;border:0;border-radius:8px;padding:14px 24px;font:700 16px inherit;cursor:pointer}p{color:#aebed3}a{color:#7ae3cc}</style>
<main><small>本地示例 · 用来观察状态检查效果</small><h1>让状态灯跟着服务变化</h1><div id="state" role="status">正在读取状态…</div><button id="toggle" disabled>读取中…</button><p>切换后，返回 Dashy 首页，等待约 10 秒。状态灯会根据这个接口实际返回的 HTTP 200 / 503 更新。</p><p>这里只改变本地演示服务的响应，不控制任何真实业务系统。</p><a href="/" target="_top">返回工作台 →</a></main>
<script>const state=document.querySelector('#state'),button=document.querySelector('#toggle');function draw(data){state.textContent=data.online?'● 正常运行 · HTTP 200':'● 维护中 · HTTP 503';state.style.color=data.online?'#7ae3cc':'#ffba88';button.textContent=data.online?'切换为维护中':'恢复为正常运行';button.disabled=false}async function refresh(){try{draw(await(await fetch('/demo-api/state')).json())}catch(e){state.textContent='服务暂时无法访问'}}button.onclick=async()=>{button.disabled=true;try{draw(await(await fetch('/demo-api/toggle',{method:'POST'})).json())}catch(e){state.textContent='切换失败，请刷新重试';button.disabled=false}};refresh();</script></html>
