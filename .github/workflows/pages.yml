name: Deploy web demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'pages.json'
      - 'projects.json'
      - 'scripts/build_pages.py'
      - 'scripts/catalog.py'
      - 'projects/**/web/dist/**'
      - 'projects/001-audio-locked-paper-theatre/**'
      - 'projects/005-diagram-design/**'
      - 'projects/006-dashy/**'
      - 'projects/007-evomap/**'
      - 'projects/008-douyin-downloader/**'
      - 'projects/009-mirofish/**'
      - 'projects/010-graft/**'
      - 'projects/011-background-agents/**'
      - 'projects/012-future-agi/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research catalog
        run: python scripts/catalog.py check
      - name: Package selected static demos
        run: python projects/001-audio-locked-paper-theatre/src/package_site.py
      - name: Build Diagram Design research gallery
        run: python projects/005-diagram-design/src/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Prepare Dashy package manager
        run: npm install --global yarn@1.22.22
      - name: Build Dashy capability study
        run: |
          python projects/006-dashy/src/build_workbench.py
          python projects/006-dashy/src/build_site.py
      - name: Build EvoMap understanding guide
        run: python projects/007-evomap/src/build_site.py
      - name: Build Douyin Downloader research guide
        run: python projects/008-douyin-downloader/src/build_site.py
      - name: Build MiroFish capability exhibit
        run: python projects/009-mirofish/src/build_site.py
      - name: Build Graft code navigation guide
        run: python projects/010-graft/src/build_site.py
      - name: Build Background Agents research guide
        run: python projects/011-background-agents/src/build_site.py
      - name: Build Future AGI evaluation research guide
        run: python projects/012-future-agi/src/build_site.py
      - name: Build combined project site
        run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
