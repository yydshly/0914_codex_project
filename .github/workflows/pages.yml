name: Deploy web demos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'pages.json'
      - 'projects.json'
      - 'scripts/build_pages.py'
      - 'scripts/catalog.py'
      - 'projects/**/web/dist/**'
      - 'projects/001-audio-locked-paper-theatre/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research catalog
        run: python scripts/catalog.py check
      - name: Package selected static demos
        run: python projects/001-audio-locked-paper-theatre/src/package_site.py
      - name: Build combined project site
        run: python scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
